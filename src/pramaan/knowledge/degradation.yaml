# =============================================================================
# Pramaan knowledge layer 3 — Evidential-quality degradation profiles
# =============================================================================
# Model: evidential quality Q(t) = 0.5 ** (t / half_life_hours[condition])
#   Q = 1.0  -> as good as at deposition
#   Q < risk_threshold -> "at risk": likely partial/failed results
#
# IMPORTANT — these half-lives are CONSERVATIVE PLANNING HEURISTICS chosen to
# rank relative perishability (e.g. wet swab << dried stain << firearm). They
# are not measured constants and must be calibrated by FSL subject-matter
# experts for each deployment. Changing this file changes the knowledge-base
# hash recorded against every triage run, so results stay reproducible.
#
# Conditions:
#   ambient      shade, 20–30 °C, dry
#   hot          > 35 °C (common in Indian summers / closed vehicles)
#   wet          rain-exposed, damp, or sealed wet in plastic
#   sunlight     direct UV exposure
#   refrigerated 2–8 °C
#   frozen       -20 °C
#   dry_sealed   properly dried and paper-packed (or airtight can for volatiles)
# =============================================================================

risk_threshold: 0.60
lab_storage_condition: refrigerated   # assumed once an exhibit is received by the FSL

