name: CI — tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements*.txt
      - name: Install
        run: pip install -r src/requirements.txt pytest
      - name: Tests
        working-directory: src
        run: python -m pytest
      - name: Benchmark (reproducible numbers quoted in docs/evaluation.md)
        working-directory: src
        run: python -m pramaan benchmark
